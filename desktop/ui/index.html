<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VV Browser</title>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #b0b0b0;
      --accent: #1e88c8;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, "Segoe UI", sans-serif;
    }
    main {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 0 24px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }
    p {
      margin: 0;
      max-width: 640px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }
    button {
      padding: 8px 24px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: var(--fg);
      font: inherit;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 2px;
    }
    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="status">Connecting to Japan…</h1>
    <p id="detail" role="status" aria-live="polite"></p>
    <button id="retry" type="button" hidden>Retry</button>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const detailEl = document.getElementById('detail');
    const retryEl = document.getElementById('retry');
    const { listen } = window.__TAURI__.event;
    const { invoke } = window.__TAURI__.core;

    function showConnecting() {
      statusEl.textContent = 'Connecting to Japan…';
      detailEl.textContent = '';
      retryEl.hidden = true;
    }

    function showError(message) {
      statusEl.textContent = 'Could not connect';
      detailEl.textContent = message;
      retryEl.hidden = false;
    }

    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash.startsWith('error=')) {
      showError(hash.slice('error='.length));
    }

    listen('core-status', (event) => {
      if (retryEl.hidden) detailEl.textContent = event.payload;
    });

    retryEl.addEventListener('click', () => {
      history.replaceState(null, '', location.pathname);
      showConnecting();
      invoke('retry').catch((err) => showError(String(err)));
    });
  </script>
</body>
</html>
